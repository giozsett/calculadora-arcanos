name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Rodar os testes com Docker Compose
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from testes

      - name: Derrubar os containers
        if: always()
        run: docker compose -f docker-compose.test.yml down
